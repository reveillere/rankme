x-common-service: &common-service
  restart: always

services:
  api:
    <<: *common-service
    build:
      context: api/
      dockerfile: ./Dockerfile.prod
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - REDIS_URI=redis://redis:6379/
      # From a .env file on the host, next to this compose file — never
      # committed (see .gitignore). Generate with: openssl rand -hex 32
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    volumes:
      - ./api/log:/app/log
      - api-data:/data
      - ./scimagojr-data:/data/scimagojr
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    <<: *common-service
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # redis.conf caps redis itself at maxmemory 500mb; this leaves it
          # headroom for its own process overhead rather than matching exactly.
          memory: 768M
          cpus: "1.0"



  front:
    <<: *common-service
    build:
      context: front/
      dockerfile: ./Dockerfile.prod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  mongo:
    <<: *common-service
    # 8.2, not 8.0: 8.0 refuses to start on Linux kernel >= 6.19
    # (https://jira.mongodb.org/browse/SERVER-121912), which recent
    # Ubuntu images already ship.
    image: mongo:8.2
    volumes:
      - db-data:/data/db
    # wiredTigerCacheSizeGB pinned explicitly: mongod otherwise sizes its
    # cache off host RAM regardless of the container's cgroup limit below,
    # and would eventually get OOM-killed as its working set grew into that
    # gap. 0.25GB/768M (the defaults below) are generous for this app's
    # steady-state footprint, but not for the local DBLP dump (~8GB of
    # data+indexes once imported, see api/src/dblpLocal.js) -- this box only
    # has 3.7GB RAM total, so that footprint can't be a permanent reservation
    # here the way it is on a dev machine (docker-compose.dev.yml's own,
    # much bigger bump). Instead scripts/deploy-dblp-dump.sh brings mongo up
    # with MONGO_CACHE_GB/MONGO_MEMORY_LIMIT overridden for just the import,
    # then back down to these defaults once it's done -- a mongod restart
    # either way (this flag can't change live), so no extra cost to doing it
    # as a brief bump-and-shrink instead of carrying it permanently.
    command: ["--quiet",  "--logpath=/data/db/mongod.log", "--wiredTigerCacheSizeGB=${MONGO_CACHE_GB:-0.25}"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${MONGO_MEMORY_LIMIT:-768M}
          cpus: "1.0"



  reverseproxy:
    <<: *common-service
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.prod
    depends_on:
      - api
      - front
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
      - type: bind
        source: "/etc/letsencrypt"
        target: "/etc/letsencrypt"
        read_only: true
      - type: bind
        source: "./certbot-webroot"
        target: "/var/www/certbot"
        read_only: true
    ports:
      - 80:80
      - 443:443
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"



volumes:
  db-data:
  redis-data:
  api-data: