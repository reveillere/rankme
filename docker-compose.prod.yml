x-common-service: &common-service
  restart: always

services:
  api:
    <<: *common-service
    build:
      context: api/
      dockerfile: ./Dockerfile.prod
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - REDIS_URI=redis://redis:6379/
      # From a .env file on the host, next to this compose file — never
      # committed (see .gitignore). Generate with: openssl rand -hex 32
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      # Comma-separated read-only API tokens. Generate each with
      # `openssl rand -hex 32`; at least one must be configured.
      - API_TOKENS=${API_TOKENS:?API_TOKENS must be set in .env}
      # Comma-separated browser origins allowed to call the API cross-origin
      # (see api/src/index.js). The front end itself doesn't need this --
      # it's same-origin behind the reverse proxy.
      - CORS_ORIGIN=${CORS_ORIGIN:-https://rankme.fr}
    volumes:
      - ./api/log:/app/log
      - api-data:/data
      - ./scimagojr-data:/data/scimagojr
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Parameterized like mongo's own MONGO_MEMORY_LIMIT below:
          # scripts/deploy-dblp-dump.sh bumps this for the DBLP import (node
          # auto-sizes its V8 heap off this cgroup limit, and the default 1G
          # -- ~511MB of old-space in practice -- isn't enough headroom for
          # a full-corpus streaming pass), then shrinks it back once done.
          memory: ${API_MEMORY_LIMIT:-1G}
          cpus: "1.0"

  redis:
    <<: *common-service
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # redis.conf caps redis itself at maxmemory 500mb; this leaves it
          # headroom for its own process overhead rather than matching exactly.
          memory: 768M
          cpus: "1.0"



  front:
    <<: *common-service
    build:
      context: front/
      dockerfile: ./Dockerfile.prod
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  mongo:
    <<: *common-service
    # 8.2, not 8.0: 8.0 refuses to start on Linux kernel >= 6.19
    # (https://jira.mongodb.org/browse/SERVER-121912), which recent
    # Ubuntu images already ship.
    image: mongo:8.2
    volumes:
      - db-data:/data/db
    # wiredTigerCacheSizeGB pinned explicitly: mongod otherwise sizes its
    # cache off host RAM regardless of the container's cgroup limit below,
    # and would eventually get OOM-killed as its working set grew into that
    # gap. 0.25GB/768M (the defaults below) are generous for this app's
    # steady-state footprint, but not for the local DBLP dump (~8GB of
    # data+indexes once imported, see api/src/dblpLocal.js) -- this box only
    # has 3.7GB RAM total, so that footprint can't be a permanent reservation
    # here the way it is on a dev machine (docker-compose.dev.yml's own,
    # much bigger bump). Instead scripts/deploy-dblp-dump.sh brings mongo up
    # with MONGO_CACHE_GB/MONGO_MEMORY_LIMIT overridden for just the import,
    # then back down to these defaults once it's done -- a mongod restart
    # either way (this flag can't change live), so no extra cost to doing it
    # as a brief bump-and-shrink instead of carrying it permanently.
    command: ["--quiet",  "--logpath=/data/db/mongod.log", "--wiredTigerCacheSizeGB=${MONGO_CACHE_GB:-0.25}"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Bumped from 768M on 2026-09-15: grafana/prometheus/umami-db all
          # had 100M+ of unused headroom in their own limits (see their own
          # compose files) while mongo was sitting at 95-98% of this one
          # under normal bot-scraping load -- freed the same 256M from
          # those three and moved it here instead of raising the host's
          # total commitment further.
          memory: ${MONGO_MEMORY_LIMIT:-1G}
          cpus: "1.0"



  # Renders anubis/botPolicy.yaml.template with the real secret from
  # RANKME_BYPASS_KEY into a shared volume anubis reads from -- same
  # pattern as monitoring/docker-compose.monitoring.yml's own token-writer
  # (there for prometheus's scrape auth), so this repo doesn't need two
  # ways to get a host .env secret into a container that only accepts a
  # config file. The template itself has no real secret in it and is safe
  # to commit; only the rendered copy (in the volume, never in git) does.
  policy-writer:
    image: alpine:3.20
    command: >
      sh -c "sed \"s/__RANKME_BYPASS_KEY__/$${RANKME_BYPASS_KEY:?RANKME_BYPASS_KEY must be set in .env}/\" /template/botPolicy.yaml.template > /shared/botPolicy.yaml && echo written"
    environment:
      - RANKME_BYPASS_KEY=${RANKME_BYPASS_KEY:?RANKME_BYPASS_KEY must be set in .env}
    volumes:
      - ./anubis/botPolicy.yaml.template:/template/botPolicy.yaml.template:ro
      - anubis-policy-shared:/shared

  # Sits between the reverseproxy's TLS-terminating front door and its
  # actual site routing (see reverse-proxy/nginx.conf.prod's own comment
  # for the full topology and why this was added 2026-09-15). Challenges
  # anything that looks like a plain browser but isn't a known-good crawler
  # with a small proof-of-work puzzle before it ever reaches mongo/api.
  anubis:
    <<: *common-service
    image: ghcr.io/techarohq/anubis:latest
    depends_on:
      policy-writer:
        condition: service_completed_successfully
    environment:
      - BIND=:8923
      - TARGET=http://reverseproxy:8081
      - POLICY_FNAME=/data/cfg/botPolicy.yaml
      # Both rankme.fr and www.rankme.fr are served identically (see
      # nginx.conf.prod's single catch-all server_name) -- dynamic domain
      # means the challenge-pass cookie works on whichever one a visitor
      # actually used instead of being pinned to one.
      - COOKIE_DYNAMIC_DOMAIN=true
      # front already serves its own robots.txt (front/public/robots.txt,
      # "Disallow: /" for everyone) -- leaving Anubis's own SERVE_ROBOTS_TXT
      # off keeps that one in effect unmodified instead of Anubis
      # overriding it with its own AI-scraper-specific one.
    volumes:
      - anubis-policy-shared:/data/cfg:ro
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # Anubis's own docs: "I suspect that 128Mi of ram may be
          # sufficient for a large number of concurrent clients."
          memory: 128M
          cpus: "0.5"

  reverseproxy:
    <<: *common-service
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.prod
    depends_on:
      - api
      - front
      - anubis
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
      - type: bind
        source: "/etc/letsencrypt"
        target: "/etc/letsencrypt"
        read_only: true
      - type: bind
        source: "./certbot-webroot"
        target: "/var/www/certbot"
        read_only: true
    ports:
      - 80:80
      - 443:443
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"



volumes:
  db-data:
  redis-data:
  api-data:
  anubis-policy-shared:
