x-common-service: &common-service
  restart: always


services:
  api:
    <<: *common-service
    build:
      context: api/
      dockerfile: ./Dockerfile.dev
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - REDIS_URI=redis://redis:6379/  
    volumes:
      - ./api/src:/app/src
      - ./api/log:/app/log
      - api-data:/data
      - ./scimagojr-data:/data/scimagojr
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"



  front:
    <<: *common-service
    build:
      context: front/
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./front/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"


  mongo:
    <<: *common-service
    image: mongo:8.0
    volumes:
      - ./db-dump:/data/db-dump
      - db-data:/data/db
    ports:
      - "27017:27017"
    # wiredTigerCacheSizeGB pinned explicitly: mongod otherwise sizes its
    # cache off host RAM (16GB+ on a 32GB dev machine) regardless of the
    # container's cgroup limit below, and would eventually get OOM-killed as
    # its working set grew into that gap. 256MB is generous for the ~73MB
    # this app actually stores (scimagojr + dblp venues + admin/CORE data).
    command: ["--quiet",  "--logpath=/data/db/mongod.log", "--wiredTigerCacheSizeGB=0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  redis:
    <<: *common-service
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # redis.conf caps redis itself at maxmemory 500mb; this leaves it
          # headroom for its own process overhead rather than matching exactly.
          memory: 768M
          cpus: "1.0"

  reverseproxy:
    <<: *common-service
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.dev
    depends_on:
      - api
      - front
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
    ports:
      - 8080:80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"


volumes:
  db-data:
  redis-data:
  api-data:
