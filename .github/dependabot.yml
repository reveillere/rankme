version: 2
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 0.5+ needs eslint 9/10 (flat config); we are still on eslint 8.
      # Remove once the front lint setup is migrated to eslint 9.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /front
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /reverse-proxy
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
